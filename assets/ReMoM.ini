# ReMoM.ini — New Game Configuration
#
# Used with:  ReMoM --newgame [ReMoM.ini]
#             ReMoM --offscreen --newgame ReMoM.ini --replay game.RMR
#
# All keys are optional. Unspecified keys use defaults.
# Lines starting with # or ; are comments.
# Values are case-insensitive.


[Game]

# difficulty = Intro | Easy | Normal | Hard | Impossible  (default: Easy)
difficulty = Normal

# magic = Weak | Normal | Powerful  (default: Normal)
magic = Normal

# landsize = Small | Medium | Large  (default: Medium)
landsize = Medium

# opponents = 0..4  (default: 1)
opponents = 3

# seed = fixed RNG seed for deterministic world generation (default: random)
# When set, the same config always produces the same world.
# Accepts decimal or hex (0x...) values.
# seed = 12345


[Wizard]

# wizard = Merlin | Raven | Sharee | Lo Pan | Jafar | Oberic | Rjak | Sss'ra
#          Tauron | Freya | Horus | Ariel | Tlaloc | Kali
# Selects a preset wizard (sets default books, retort, and name).
# Individual books/retorts below override the preset values.
wizard = Merlin

# name = custom wizard name (up to 19 characters, default: preset name)
# name = MyWizard

# race = Barbarian | Beastmen | Dark Elf | Draconian | Dwarf | Gnoll | Halfling
#        High Elf | High Men | Klackon | Lizardman | Nomad | Orc | Troll
# (default: High Men)
race = High Men

# banner = Blue | Green | Purple | Red | Yellow | Brown  (default: Blue)
banner = Blue


[Books]

# Spell book counts per realm (0..13).
# If not specified, the preset wizard's books are used.
# books_nature = 5
# books_sorcery = 0
# books_chaos = 0
# books_life = 5
# books_death = 0


[Retorts]

# Wizard Special Abilities: T or F
# If not specified, the preset wizard's retort is used.
# Only the specified retorts are overridden; others keep the preset value.
#
# Alchemy = F
# Warlord = F
# Chaos Mastery = F
# Nature Mastery = F
# Sorcery Mastery = F
# Infernal Power = F
# Divine Power = F
# Sage Master = F
# Channeler = F
# Myrran = F
# Archmage = F
# Mana Focusing = F
# Node Mastery = F
# Famous = F
# Runemaster = F
# Conjurer = F
# Charismatic = F
# Artificer = F


[Paths]

# Where ReMoM writes its logs and its saves.
#
# "." means the current working directory -- i.e. next to the executable.  That is what a repo /
# development build wants: logs and saves land in out/build/<preset>/bin/<config>/ where you can
# see them, instead of in the per-user directories.
#
# This file is a dev/modder template and is deliberately NOT bundled in a player's install, so an
# installed game finds no [Paths] and keeps the per-user defaults:
#     logs   %LOCALAPPDATA%\ReMoM\logs   (XDG_STATE_HOME/ReMoM)
#     saves  %APPDATA%\ReMoM             (XDG_DATA_HOME/ReMoM)
#
# Precedence for logs:  REMOM_LOG_DIR (env)  ->  log_dir  ->  per-user state dir  ->  CWD
# Precedence for saves: save_dir  ->  per-user data dir
#
# Comment either key out to fall back to the per-user directory for that kind of file.

log_dir = .
save_dir = .


[Video]

# How the game window starts and how the 320x200 picture is scaled into it.  Read once at startup;
# the game never writes this file.  While playing, Alt+Enter switches between fullscreen and the
# window at any time, for the session only.
#
# ReMoM reads each key from the ReMoM.ini in the folder it is started from, then from the per-user
# ReMoM.ini (%APPDATA%\ReMoM\ReMoM.ini on Windows, ~/.config/ReMoM/ReMoM.ini on Linux).
#
# startup_window = fullscreen | windowed       (default: fullscreen)
#     fullscreen  the whole monitor the window is on, taskbar included.  It is a borderless window, so
#                 Alt+Tab is instant and the screen never changes resolution (ReMoM has no exclusive
#                 fullscreen).  The mouse stays on the game picture until you Alt+Tab away.
#     windowed    a normal window with a title bar, which you can move and resize.
#
# scale_mode = integer | fit_nearest | fit_sharp_bilinear       (default: integer)
#     integer             the largest whole-number scale that fits, black bars around it -- every
#                         pixel the same size, perfectly crisp.
#     fit_nearest         as large as the screen allows at the game's shape -- fills more of the
#                         screen, but some pixel rows and columns come out one screen pixel wider
#                         than others.
#     fit_sharp_bilinear  the same size as fit_nearest, with every pixel the same size; the edges
#                         between pixels are softened by a fraction of a screen pixel.
#
# aspect_ratio = 16:10 | 4:3       (default: 16:10)
#     16:10  square pixels, the shape the 320x200 picture has on a modern screen.
#     4:3    the shape the game had on a 1994 monitor: each pixel a little taller than it is wide,
#            so circles come out round.  The window opens at 1280x960.  With scale_mode =
#            integer some pixel rows come out one screen pixel taller than others (except at
#            1600x1200); fit_sharp_bilinear makes them all look the same.
#
# A value that isn't understood is logged and the default is used.

startup_window = fullscreen
# scale_mode = integer
# aspect_ratio = 16:10


[Logging]
severity_threshold = DEBUG   # renders/normal play: DEBUG and up; TRACE (incl. [GD] dumps) filtered

# severity_threshold = TRACE | DEBUG | INFO | WARN | ERROR | FATAL  (default: TRACE)
# Messages below this severity are filtered at runtime.
# The compile-time floor (STU_LOG_MIN_SEVERITY) wins if it is higher.
# severity_threshold = INFO

# Per-category enables. Any category not listed defaults to true.
# Disable a noisy subsystem when you don't need it.
# GENERAL = true
# AIMOVE  = true
# COMBAT  = true
# COMBAT_TEST: test-only move/attack legality logging (MOVE/MOVE_STEP/ATTACK lines,
# consumed by tools/check_combat_legality.py).  Off by default; enabled here for the
# combat-legality test.  Set false (or remove) to silence it in normal play.
COMBAT_TEST = true
# INTEGRITY: runtime integrity checkpoints -- invalid game state (e.g. _map_plane out of range),
# static-pool guard damage (set REMOM_POOL_GUARDS=1 to enable the guards), and map draws refused
# because of a bad index.  ERROR-level; on by default.  Leave it on when reporting a crash.
# INTEGRITY = true
# SAVE    = true
# PFL     = true
# IKI     = true
